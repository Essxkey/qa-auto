# 测试套件持续集成：UI 自动化（SauceDemo 28 条）+ 接口自动化（Notes API 54 条）
#
# 触发时机：
#   - push 到 main/master
#   - 任何 pull_request
#   - 手动触发（仓库 Actions 页面 → Run workflow）
# 两个 job 并行执行，结束后可在 Actions 页面下载 HTML 测试报告。

name: Test Suite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- UI 自动化
  ui-tests:
    name: UI 自动化（SauceDemo 28 条）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: saucedemo_auto
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11（带 pip 缓存）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: saucedemo_auto/requirements.txt

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 运行 UI 用例（无头模式）
        env:
          HEADLESS: '1'
        run: python -m pytest --html=report.html --self-contained-html

      - name: 上传 UI 测试报告
        if: always()          # 用例失败也上传，方便定位
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-ui-report
          path: saucedemo_auto/report.html
          if-no-files-found: warn

  # ---------------------------------------------------------------- 接口自动化
  api-tests:
    name: 接口自动化（Notes API 54 条）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: notes_api_auto
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11（带 pip 缓存）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: notes_api_auto/requirements.txt

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 运行接口用例
        run: python -m pytest --html=report.html --self-contained-html

      - name: 上传接口测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-api-report
          path: notes_api_auto/report.html
          if-no-files-found: warn
